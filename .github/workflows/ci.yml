name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    name: Lint (API)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff==0.4.4
      - name: Lint
        run: ruff check api/src --select E,F,I --ignore E501,ANN,N

  test-api:
    name: Test (API)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: calibration_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install API dependencies
        working-directory: api
        run: pip install -e ".[dev]"
      - name: Run API tests
        working-directory: api
        run: pytest tests/ -v --tb=short --cov=src --cov-report=xml --cov-report=term-missing
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/calibration_test
          REDIS_URL: redis://localhost:6379
          DEV_MODE: "true"
          APP_ENV: test
      - uses: codecov/codecov-action@v4
        with:
          file: api/coverage.xml
        continue-on-error: true

  test-worker:
    name: Test (Worker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install worker dependencies
        working-directory: worker
        run: pip install pytest pytest-asyncio pytest-cov pydantic pydantic-settings structlog numpy
      - name: Run worker tests
        working-directory: worker
        run: pytest tests/ -v --tb=short
