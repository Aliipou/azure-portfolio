version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: calibration_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
      target: development
    ports:
      - "8000:8000"
    volumes:
      - ./api/src:/app/src
      - ./api/tests:/app/tests
      - ./api/alembic:/app/alembic
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/calibration_db
      REDIS_URL: redis://redis:6379
      USE_REDIS_QUEUE: "true"
      DEV_MODE: "true"
      APP_ENV: dev
      LOG_LEVEL: debug
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3

  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
      target: development
    volumes:
      - ./worker/src:/app/src
      - /tmp/calibration-blobs:/tmp/calibration-blobs
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/calibration_db
      REDIS_URL: redis://redis:6379
      USE_REDIS_QUEUE: "true"
      DEV_MODE: "true"
      APP_ENV: dev
      LOG_LEVEL: debug
      ANOMALY_Z_SCORE_THRESHOLD: "3.0"
      ANOMALY_MODEL_VERSION: "1.0.0"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy

volumes:
  postgres_data:
