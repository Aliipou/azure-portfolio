version: "3.9"
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: calibration
      POSTGRES_USER: calibration
      POSTGRES_PASSWORD: calibration
    ports: ["5432:5432"]
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U calibration"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports: ["8080:8080"]
    environment:
      DATABASE_URL: "postgres://calibration:calibration@postgres:5432/calibration"
      GIN_MODE: release
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pg_data:
